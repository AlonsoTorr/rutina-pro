<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutina Natación PRO</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      font-size: 20px;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .content {
      margin-top: 10px;
      background: #020617;
      padding: 10px;
      border-radius: 10px;
    }

    .start {
      background: #22c55e;
    }

    .pause {
      background: #f59e0b;
    }

    .reset {
      background: #ef4444;
    }

    input {
      width: 60px;
      text-align: center;
      border: none;
      border-radius: 5px;
    }

    .timer-display {
      margin-top: 10px;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>🏊 Rutina PRO</header>
  <div id="menu" class="container">
    <div class="card"><button onclick="openDay('lunes')">📅 Lunes</button></div>
  </div>
  <div id="lunes" class="container hidden"><button onclick="back()">⬅ Volver</button>

    <div id="ejercicios"></div>
  </div>
  <audio id="alarm">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
  </audio>
  <script src="labatidora.js"></script>
  <script src="inmersion.js"></script>
  <script>

    const menu = document.getElementById("menu");

    let timers = new Map();

    function openDay(day) {
      menu.classList.add("hidden");
      document.getElementById(day).classList.remove("hidden");
    }

    function back() {
      menu.classList.remove("hidden");
      document.getElementById("lunes").classList.add("hidden");
    }

    function toggle(btn) {
      btn.nextElementSibling.classList.toggle("hidden");
    }

    function startTimer(btn) {
      let box = btn.parentElement;
      let display = box.querySelector(".timer-display");
      let input = box.querySelector("input");

      let time = parseInt(input.value) * 60;

      if (timers.has(box)) return;

      let interval = setInterval(() => {
        let m = Math.floor(time / 60);
        let s = time % 60;

        display.innerText = m + ":" + (s < 10 ? "0" : "") + s;

        time--;

        if (time < 0) {
          clearInterval(interval);
          timers.delete(box);
          display.innerText = "⏰ Terminado";
          document.getElementById("alarm").play();
        }

      }, 1000);

      timers.set(box, { interval, time });
    }

    function pauseTimer(btn) {
      let box = btn.parentElement;

      if (!timers.has(box)) return;

      let data = timers.get(box);
      clearInterval(data.interval);
      timers.delete(box);
    }

    function resetTimer(btn) {
      let box = btn.parentElement;
      let display = box.querySelector(".timer-display");

      if (timers.has(box)) {
        clearInterval(timers.get(box).interval);
        timers.delete(box);
      }

      display.innerText = "0:00";
    }

    let ejercicios =
    document.getElementById("ejercicios");

    ejercicios.innerHTML =
      labatidora()+
      inmersion();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registrado'));
    }
    </script>
</body>

</html>
