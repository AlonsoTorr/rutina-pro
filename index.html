<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutina Natación PRO</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: -apple-system;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      text-align: center;
      padding: 15px;
      background: #1e293b;
      font-size: 20px;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 25px;
    }

     .cardo {
      justify-content: space-between;
      margin-bottom: 10px;
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 25px;
      align-items: center;
    }

    button {
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 20px;
    }

    .hidden {
      display: none;
    }

    .content {
      margin-top: 10px;
      background: #020617;
      padding: 10px;
      border-radius: 10px;
    }

    .start {
      background: #22c55e;
    }

    .pause {
      background: #f59e0b;
    }

    .reset {
      background: #ef4444;
    }

    input {
      width: 60px;
      text-align: center;
      border: none;
      border-radius: 8px;
    }

    .timer-display {
      margin-top: 30px;
      font-size: 40px;
      text-align: center;
    }

    .grid-ejercicios {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 10px;
    }
    .grid-botones {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .top-bar button {
      width: auto;
    }

      .btn-eliminar {
        background: #ffffff;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      
      .header-ejercicio {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .activo {
        background: #57615b;
      }

      .btnlarge {
        justify-content: center;
        gap: 70px;
        flex-wrap: wrap;
      }
  
      .btnlarge:not(.hidden) {
        display: flex;
        justify-content: center;
        gap: 70px;
        flex-wrap: wrap;
    }
 
      
      
  </style>
</head>

<body>
  <header>🏊 Rutina PRO</header>
  <div id="menu" class="container">
    <div class="card">
        <button onclick="openDay('lunes')">EMPEZAMOS</button></div>
  </div>
  <div id="lunes" class="container hidden">

    <div class="top-bar">
       <button onclick="back()">⬅ Volver</button>
       <button onclick="toggleColumnas()"id="btn-columnas">X1</button>
    </div>

    <h3>Ejercicios Disponibles</h3>

  <div class="cardo">
     <button onclick="toggleSection('caca')">DESPLAZAMIENTO</button></div>
  <div id="caca" class="container hidden btnlarge">
        <button onclick="agregarDesplazamiento()">Desplazamiento</button>
              <button onclick="agregarCaballito()">El Caballito</button>
                  <button onclick="agregarTabla()">Tabla</button>
    </div>

  <div class="cardo">
         <button onclick="toggleSection('1')">FLOTACION</button></div>
  <div id="1" class="container hidden btnlarge">
        <button onclick="agregarFlotacion()">Flotacion con apoyo</button>
           <button onclick="agregarFlotacion2()">Flotacion con apoyo movil</button>
             <button onclick="agregarFlotacion3()">Flotacion con deslizamiento</button>
  </div>

  <div class="cardo">
        <button onclick="toggleSection('2')">INMERSION</button></div>
    <div id="2" class="container hidden btnlarge">
        <button onclick="agregarInmersion()">Inmersion</button>
           <button onclick="agregarAlsofa()">Sofá</button>
             <button onclick="agregarBusitos()">Busitos</button>
  </div>

  <div class="cardo">
        <button onclick="toggleSection('3')">RESPIRACION</button></div>
    <div id="3" class="container hidden btnlarge">
        <button onclick="agregarRespiracion()">Dezplazar la Pelota</button>
           <button onclick="agregarRespiracion2()">Soplar en el Agua</button>
  </div>  

    <div class="cardo">  
    <button onclick="agregarBatidora()">La Batidora</button>
    </div>

    <h3>Mi rutina</h3>
    <div id="mi-rutina" 
      class="grid-ejercicios"></div>

  </div>
  <audio id="alarm">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
  </audio>
  <script src="labatidora.js"></script>
  <script src="inmersion/inmersion.js"></script>
  <script src="inmersion/alsofa.js"></script>
  <script src="inmersion/busitos.js"></script>
  <script src="desplazamiento/elcaballito.js"></script>
  <script src="desplazamiento/desplazamiento.js"></script>
  <script src="desplazamiento/tabla.js"></script>
  <script src="flotacion/flotacion.js"></script>
  <script src="flotacion/flotacion2.js"></script>
  <script src="flotacion/flotacion3.js"></script>
  <script src="respiracion/respiracion.js"></script>
  <script src="respiracion/respiracion2.js"></script>
    <script>

    const menu = document.getElementById("menu");

    let timers = new Map();

    function openDay(day) {
      menu.classList.add("hidden");
      document.getElementById(day).classList.remove("hidden");
    }

    function toggleSection(id) {
       let section = document.getElementById(id);
      section.classList.toggle("hidden");
    }

    function back() {
      menu.classList.remove("hidden");
      document.getElementById("lunes").classList.add("hidden");
    }

    function toggle(btn) {
      let card = btn.closest(".cardo");
      let content = card.querySelector(".content");
      card.querySelectorAll('.header-ejercicio button').forEach(b => b.classList.remove('activo'));

      if (!content.classList.contains("hidden")) {
        content.classList.add("hidden");
        return;
    }
      content.classList.remove("hidden");
      btn.classList.add('activo');
    }


    function startTimer(btn) {
      let box = btn.parentElement;
      let display = box.querySelector(".timer-display");
      let input = box.querySelector("input");

      let time = parseInt(input.value) * 60;

      if (timers.has(box)) return;

      let interval = setInterval(() => {
        let m = Math.floor(time / 60);
        let s = time % 60;

        display.innerText = m + ":" + (s < 10 ? "0" : "") + s;

        time--;

        if (time < 0) {
          clearInterval(interval);
          timers.delete(box);
          display.innerText = "⏰ Terminado";
          document.getElementById("alarm").play();
        }

      }, 1000);

      timers.set(box, { interval, time });
    }

    function pauseTimer(btn) {
      let box = btn.parentElement;

      if (!timers.has(box)) return;

      let data = timers.get(box);
      clearInterval(data.interval);
      timers.delete(box);
    }

    function resetTimer(btn) {
      let box = btn.parentElement;
      let display = box.querySelector(".timer-display");

      if (timers.has(box)) {
        clearInterval(timers.get(box).interval);
        timers.delete(box);
      }

      display.innerText = "0:00";
    }

    let columnas = 1;
    
    function toggleColumnas() {
      columnas++;

      if (columnas > 4) columnas = 1;

      let cont=
      document.getElementById("mi-rutina");
      cont.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;

      document.getElementById("btn-columnas").innerText = "X" + columnas;
    }
    function mostrarContenido(btn, tipo) {
      let card = btn.closest(".cardo");

      let normal = card.querySelector(".normal");
      let variante = card.querySelector(".variante");

      let actual =tipo === 'normal' ? normal : variante;

      if (!actual.classList.contains("hidden")) {
        actual.classList.add("hidden");
        return;
      }

      normal.classList.add("hidden");
      variante.classList.add("hidden");

      actual.classList.remove("hidden");
    }
    function mostrarContenido(btn, tipo) {
      let card = btn.closest(".cardo");

      let normal = card.querySelector(".normal");
      let variante = card.querySelector(".variante");

      let actual =tipo === 'normal' ? normal : variante;

    card.querySelectorAll('.header-ejercicio button').forEach(b => b.classList.remove('activo'));
      if (!actual.classList.contains("hidden")) {
        actual.classList.add("hidden");
        return;
      }
      normal.classList.add("hidden");
      variante.classList.add("hidden");

      actual.classList.remove("hidden");
      btn.classList.add('activo');

    }

    function agregarBatidora() {
      document.getElementById("mi-rutina").innerHTML += labatidora();
    }
    function agregarBusitos() {
      document.getElementById("mi-rutina").innerHTML += busitos();
    }
    function agregarCaballito() {
      document.getElementById("mi-rutina").innerHTML += alcaballito();
    }
    function agregarTabla() {
      document.getElementById("mi-rutina").innerHTML += tabla();
    }
    function agregarDesplazamiento() {
      document.getElementById("mi-rutina").innerHTML += desplazamiento();
    }
    function agregarAlsofa() {
      document.getElementById("mi-rutina").innerHTML += alsofa();
    }
    function agregarInmersion() {
      document.getElementById("mi-rutina").innerHTML += inmersion();
    }
    function agregarFlotacion() {
      document.getElementById("mi-rutina").innerHTML += flotacion();
    }
    function agregarFlotacion2() {
      document.getElementById("mi-rutina").innerHTML += flotacion2();
    }
    function agregarFlotacion3() {
      document.getElementById("mi-rutina").innerHTML += flotacion3();
    }
    function agregarRespiracion() {
      document.getElementById("mi-rutina").innerHTML += respiracion();
    }
    function agregarRespiracion2() {
      document.getElementById("mi-rutina").innerHTML += respiracion2();
    }

    function CambiarColumnas(num) {
      document.getElementById("mi-rutina").style.gridTemplateColumns = `repeat(${num}, 1fr)`;
    }

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registrado'));
    }
    </script>
</body>

</html>
